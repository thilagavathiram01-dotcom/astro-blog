<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Gemini app overlay on a Windows desktop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ab4f8"/>
      <stop offset="0.5" stop-color="#c58af9"/>
      <stop offset="1" stop-color="#81c995"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="160" fill="#4f46e5" opacity="0.18"/>
  <circle cx="1040" cy="560" r="200" fill="#22d3ee" opacity="0.12"/>
  <rect x="70" y="70" width="1060" height="520" rx="18" fill="url(#win)" stroke="#334155"/>
  <rect x="70" y="70" width="1060" height="42" rx="18" fill="#0b1220"/>
  <circle cx="96" cy="91" r="6" fill="#f87171"/>
  <circle cx="116" cy="91" r="6" fill="#fbbf24"/>
  <circle cx="136" cy="91" r="6" fill="#34d399"/>
  <rect x="96" y="140" width="280" height="16" rx="4" fill="#334155"/>
  <rect x="96" y="172" width="420" height="10" rx="3" fill="#1e293b"/>
  <rect x="96" y="196" width="380" height="10" rx="3" fill="#1e293b"/>
  <rect x="96" y="240" width="620" height="220" rx="10" fill="#111827" stroke="#334155"/>
  <rect x="116" y="262" width="180" height="12" rx="3" fill="#475569"/>
  <rect x="116" y="290" width="560" height="8" rx="3" fill="#1f2937"/>
  <rect x="116" y="310" width="520" height="8" rx="3" fill="#1f2937"/>
  <rect x="116" y="330" width="480" height="8" rx="3" fill="#1f2937"/>
  <g filter="url(#soft)">
    <rect x="430" y="210" width="520" height="340" rx="20" fill="#0b1020" stroke="url(#gem)" stroke-width="2"/>
    <circle cx="470" cy="250" r="16" fill="url(#gem)"/>
    <text x="500" y="256" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600">Gemini</text>
    <rect x="454" y="286" width="472" height="44" rx="12" fill="#111827"/>
    <text x="470" y="314" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14">Alt + Space — ask about this document</text>
    <rect x="454" y="348" width="360" height="28" rx="8" fill="#1e293b"/>
    <rect x="454" y="388" width="400" height="10" rx="3" fill="#334155"/>
    <rect x="454" y="408" width="340" height="10" rx="3" fill="#334155"/>
    <rect x="454" y="428" width="300" height="10" rx="3" fill="#334155"/>
    <rect x="454" y="470" width="140" height="36" rx="10" fill="url(#gem)"/>
    <text x="478" y="493" fill="#0b1220" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Ask Gemini</text>
  </g>
  <text x="70" y="630" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="16">Gemini app for Windows — overlay help without leaving your work</text>
</svg>
