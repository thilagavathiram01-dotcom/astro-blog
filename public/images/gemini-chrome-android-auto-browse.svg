<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Gemini in Chrome on Android featured image</title>
  <desc id="desc">Editorial illustration of an Android phone running Chrome with a Gemini assistant sheet and an auto browse task checklist.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="50%" stop-color="#0b3b4a"/>
      <stop offset="100%" stop-color="#082032"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="180" cy="80" r="190" fill="#22d3ee" opacity="0.12"/>
  <circle cx="1040" cy="540" r="220" fill="#34d399" opacity="0.14"/>
  <rect x="88" y="72" width="352" height="486" rx="44" fill="url(#glass)" stroke="#67e8f9" stroke-opacity="0.35"/>
  <rect x="118" y="108" width="292" height="36" rx="18" fill="#0f172a"/>
  <circle cx="142" cy="126" r="7" fill="#f87171"/>
  <circle cx="164" cy="126" r="7" fill="#fbbf24"/>
  <circle cx="186" cy="126" r="7" fill="#34d399"/>
  <rect x="210" y="116" width="180" height="20" rx="10" fill="#1e293b"/>
  <rect x="118" y="160" width="292" height="210" rx="18" fill="#0f172a" opacity="0.7"/>
  <rect x="138" y="180" width="170" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="138" y="204" width="252" height="10" rx="5" fill="#64748b"/>
  <rect x="138" y="224" width="220" height="10" rx="5" fill="#475569"/>
  <rect x="138" y="256" width="120" height="28" rx="14" fill="url(#accent)"/>
  <rect x="268" y="256" width="102" height="28" rx="14" fill="#334155"/>
  <rect x="138" y="304" width="252" height="46" rx="12" fill="#164e63"/>
  <rect x="118" y="388" width="292" height="140" rx="20" fill="#042f2e" opacity="0.9"/>
  <text x="138" y="424" fill="#a7f3d0" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="600">Auto Browse plan</text>
  <text x="138" y="454" fill="#ccfbf1" font-family="Inter, Segoe UI, sans-serif" font-size="15">1. Read ticket details</text>
  <text x="138" y="480" fill="#ccfbf1" font-family="Inter, Segoe UI, sans-serif" font-size="15">2. Find nearby parking</text>
  <text x="138" y="506" fill="#99f6e4" font-family="Inter, Segoe UI, sans-serif" font-size="15">3. Wait for your confirm</text>
  <text x="500" y="168" fill="#ecfeff" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="700">Gemini in Chrome</text>
  <text x="500" y="214" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="22">Summarize, file, then browse with a brake</text>
  <rect x="500" y="258" width="260" height="56" rx="16" fill="url(#accent)"/>
  <text x="528" y="294" fill="#042f2e" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Page summary</text>
  <rect x="780" y="258" width="260" height="56" rx="16" fill="#22d3ee" opacity="0.85"/>
  <text x="818" y="294" fill="#042f2e" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Calendar + Keep</text>
  <rect x="500" y="336" width="540" height="56" rx="16" fill="#0ea5e9" opacity="0.85"/>
  <text x="620" y="372" fill="#042f2e" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Auto Browse on Android</text>
  <rect x="500" y="420" width="540" height="96" rx="22" fill="url(#glass)" stroke="#5eead4" stroke-opacity="0.4"/>
  <text x="528" y="464" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="20">U.S. Android Chrome · confirm the last tap</text>
  <text x="528" y="496" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="16">Pro / Ultra required for agentic browsing</text>
</svg>
