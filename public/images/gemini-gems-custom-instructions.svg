<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Editorial graphic for Gemini Gems custom instructions tutorial">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#1b3a4b"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ec5ff"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="160" fill="#67e8f9" opacity="0.12"/>
  <circle cx="160" cy="540" r="180" fill="#c4b5fd" opacity="0.12"/>
  <rect x="72" y="78" width="720" height="474" rx="28" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="96" y="108" width="672" height="48" rx="12" fill="#1e293b"/>
  <circle cx="124" cy="132" r="7" fill="#f87171"/>
  <circle cx="148" cy="132" r="7" fill="#fbbf24"/>
  <circle cx="172" cy="132" r="7" fill="#34d399"/>
  <text x="208" y="138" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18">gemini.google.com / New Gem</text>
  <text x="112" y="204" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700">Brand Voice Editor</text>
  <text x="112" y="244" fill="#93c5fd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">Persona · Task · Context · Format</text>
  <rect x="112" y="272" width="640" height="232" rx="16" fill="#111827"/>
  <text x="136" y="310" fill="#cbd5e1" font-family="ui-monospace,Menlo,monospace" font-size="16">You are a concise writing editor.</text>
  <text x="136" y="344" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="16">Rewrite for clarity. Keep facts.</text>
  <text x="136" y="378" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="16">Return: headline, draft, 3 cuts.</text>
  <text x="136" y="412" fill="#67e8f9" font-family="ui-monospace,Menlo,monospace" font-size="16">Knowledge: style-guide.pdf</text>
  <polygon points="980,210 1048,250 1048,330 980,370 912,330 912,250" fill="url(#gem)" filter="url(#soft)" opacity="0.95"/>
  <text x="848" y="430" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="600">Reusable Gemini Gems</text>
  <text x="848" y="464" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">Save instructions once. Prompt less.</text>
</svg>
