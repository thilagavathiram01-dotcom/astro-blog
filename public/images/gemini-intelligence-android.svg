<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Gemini Intelligence on Android featured image</title>
  <desc id="desc">Editorial graphic of an Android phone home screen with a generated widget, voice waveform, and automation steps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
